<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><title>PFP</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Hanken+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1080px;overflow:hidden}
.pfp{width:1080px;height:1080px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(130% 110% at 50% 30%,#35563b 0%,#294732 60%,#1f3627 100%)}
/* wordmark stacked */
.word{font-family:'Cormorant Garamond',serif;font-weight:700;color:#f3efe3;text-align:center;line-height:.86;letter-spacing:.01em}
.word .l1{font-size:210px}
.word .l2{font-size:210px}
.word .rule{width:250px;height:3px;background:#c9d6bf;opacity:.55;margin:34px auto 30px}
.word .tag{font-family:'Hanken Grotesk',sans-serif;font-weight:700;font-size:40px;letter-spacing:.42em;color:#b9cdae;text-transform:uppercase}
/* monogram */
.mono{font-family:'Cormorant Garamond',serif;font-weight:700;color:#f3efe3;font-size:520px;line-height:.8;letter-spacing:-.04em}
.mono-tag{font-family:'Hanken Grotesk',sans-serif;font-weight:700;font-size:44px;letter-spacing:.4em;color:#b9cdae;text-transform:uppercase;margin-top:20px}
</style></head>
<body>
<div class="pfp" id="pfp"></div>
<script>
var v=(location.search.match(/v=(\w+)/)||[])[1]||'word';
var el=document.getElementById('pfp');
if(v==='mono'){
  el.innerHTML='<div class="mono">ST</div><div class="mono-tag">Tandil</div>';
}else{
  el.innerHTML='<div class="word"><div class="l1">Sin</div><div class="l2">Talar</div><div class="rule"></div><div class="tag">WPC · Tandil</div></div>';
}
</script>
</body></html>
